llm:
  type: sglang
  model_path: YOUR_MODEL_PATH
  temperature: 0.7
  top_p: 0.95
  top_k: 20
  max_tokens: 10000
  max_retries: 2
  enable_thinking: true
  tp_size: 8
  dtype: bfloat16
  mem_fraction_static: 0.7
  disable_radix_cache: true
  enable_memory_saver: true
  enable_return_hidden_states: true
  sampling_seed: 42

compressor:
  checkpoint: YOUR_COMPRESSOR_CHECKPOINT

inference:
  n_retrieve: 3
  task_cond: true
  qformer_device: cuda:0

memory_bank:
  index_path: YOUR_MEMORY_BANK_PATH
  allow_self_retrieval: true

run:
  result_dir: results/envscaler_latent_eval200

datasets:
  envscaler:
    rl_scenario_path: YOUR_EVAL_SCENARIO_PATH
    env_meta_path: YOUR_ENV_META_PATH
    max_steps: 30
    concurrency: 32
